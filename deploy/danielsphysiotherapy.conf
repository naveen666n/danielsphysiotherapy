server {

    server_name danielsphysiotherapy.in www.danielsphysiotherapy.in;

    root /var/www/danielsphysiotherapy/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/danielsphysiotherapy.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/danielsphysiotherapy.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.danielsphysiotherapy.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = danielsphysiotherapy.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name danielsphysiotherapy.in www.danielsphysiotherapy.in;
    return 404; # managed by Certbot




}